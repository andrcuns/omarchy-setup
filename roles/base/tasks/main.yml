---
# most packages come already pre-installed, duplicate installation in case defaults change in the future
- name: Install extra packages
  community.general.pacman:
    name:
      - chezmoi
      - firefox
      - mkcert
      - ttf-firacode-nerd
      - nordvpn-bin
      # terminal
      - kitty
      - zsh
      - diff-so-fancy
      - direnv
      - pass
      - btop
      - glab
      - fzf
      - bat
      - eza
      - jq
      - lazygit
      - lazydocker
      - zoxide
      - starship
      - ncdu
      - git
      # cloud
      - k9s
      - helm
      - kubectl
      - kubectx
      # password management
      - bitwarden
      - bitwarden-cli
    state: latest
    update_cache: true
  become: true

- name: Install zed editor
  shell: curl -f https://zed.dev/install.sh | sh

- name: Remove unneeded packages
  community.general.pacman:
    name:
      - herdr # manage herdr via mise
      - 1password-beta
      - 1password-cli
      - signal-desktop
    state: absent
  become: true

- name: Enable and start NordVPN daemon
  ansible.builtin.systemd_service:
    name: nordvpnd
    enabled: true
    state: started
  become: true

- name: Add current user to NordVPN group
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: nordvpn
    append: true
  become: true
