- name: Ensure user bin directory exists
  file:
    path: "{{ user.home }}/bin"
    state: directory
    mode: "0755"

- name: Create pi shim
  copy:
    src: pi
    dest: "{{ user.home }}/bin/pi"
    mode: "0755"

- name: Remove preinstalled harness shims
  file:
    path: "{{ user.home }}/.local/bin/{{ item }}"
    state: absent
  loop:
    - codex
    - copilot
    - claude
    - crush
    - gemini
    - gh
    - ghui
    - grok
    - opencode
    - pi
    - playwright
    - omp
